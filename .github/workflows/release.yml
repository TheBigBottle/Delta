# Builds the Linux binaries and publishes a GitHub release whenever a version tag is pushed:
#   git tag v1.3.0 && git push origin v1.3.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload the binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Same build as locally: gofmt, vet, tests, then the cross-compiled binaries in dist/.
      # The tag without the leading "v" becomes the version shown by "delta -version".
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --all

      - name: Checksums
        run: cd dist && sha256sum delta-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Delta $GITHUB_REF_NAME" --generate-notes
